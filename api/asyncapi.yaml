asyncapi: 3.0.0
info:
  title: Pricofy Geocode ES
  version: 1.0.0
  description: |
    Spanish postal code geocoding, validation, and autocomplete microservice.
    
    This service provides 6 operations for Spanish postal codes:
    - **geocode-by-postal**: Convert postal code or municipality to coordinates
    - **reverse-geocode**: Find nearest postal code from coordinates
    - **validate-postal**: Check if postal code exists
    - **validate-municipality**: Check if municipality exists
    - **autocomplete-postal**: Prefix-based postal code search
    - **autocomplete-municipality**: Fuzzy municipality search
    
    **Architecture**: Hexagonal architecture (Ports & Adapters) with dependency injection.
    Single Lambda function with internal routing via `operation` parameter.
    
    **Invocation**: Internal service invoked by `pricofy-location-service` via AWS Lambda SDK (no HTTP/API Gateway).
    
    **Data Source**: Static database of 11,150 Spanish postal codes from GeoNames (embedded in binary).
    
    **Performance**: less than 1ms postal lookup, ~10-20ms reverse geocode, less than 5ms autocomplete.
    
    **Optimizations (v1.0.0)**:
    - Dependency injection pattern for testability
    - Tests co-located with code (*_test.go)
    - Structured logging with CloudWatch Insights
    - In-memory indices for O(1) lookups
    - Cold start: ~200ms (3-5x faster than Node.js)
  contact:
    name: Pricofy Team
    email: dev@pricofy.com
  license:
    name: Private

servers:
  production:
    host: pricofy-geocode-es
    protocol: lambda
    protocolVersion: "1.0"
    description: "AWS Lambda Direct Invoke (function: pricofy-geocode-es)"

operations:
  geocodeByPostal:
    action: receive
    channel:
      $ref: '#/channels/geocodeByPostal'
    summary: Geocode postal code to coordinates
    description: Converts Spanish postal code to geographic coordinates using static database of 11,150 postal codes.
    
  reverseGeocode:
    action: receive
    channel:
      $ref: '#/channels/reverseGeocode'
    summary: Reverse geocode coordinates to postal code
    description: "Finds nearest Spanish postal code from GPS coordinates. Performance: ~10-20ms."
    
  validatePostal:
    action: receive
    channel:
      $ref: '#/channels/validatePostal'
    summary: Validate postal code
    description: "Checks if Spanish postal code exists in the database. Performance: less than 1ms."
    
  validateMunicipality:
    action: receive
    channel:
      $ref: '#/channels/validateMunicipality'
    summary: Validate municipality
    description: "Checks if Spanish municipality exists in the database. Performance: less than 1ms."
    
  autocompletePostal:
    action: receive
    channel:
      $ref: '#/channels/autocompletePostal'
    summary: Autocomplete postal code
    description: "Searches Spanish postal codes by prefix. Performance: less than 5ms."
    
  autocompleteMunicipality:
    action: receive
    channel:
      $ref: '#/channels/autocompleteMunicipality'
    summary: Autocomplete municipality
    description: "Searches Spanish municipalities by query (fuzzy search). Performance: less than 5ms."

channels:
  geocodeByPostal:
    address: pricofy-geocode-es
    messages:
      GeocodeByPostalRequest:
        $ref: '#/components/messages/GeocodeByPostalRequest'
      GeocodeByPostalResponse:
        $ref: '#/components/messages/GeocodeByPostalResponse'
  
  reverseGeocode:
    address: pricofy-geocode-es
    messages:
      ReverseGeocodeRequest:
        $ref: '#/components/messages/ReverseGeocodeRequest'
      ReverseGeocodeResponse:
        $ref: '#/components/messages/ReverseGeocodeResponse'
  
  validatePostal:
    address: pricofy-geocode-es
    messages:
      ValidatePostalRequest:
        $ref: '#/components/messages/ValidatePostalRequest'
      ValidatePostalResponse:
        $ref: '#/components/messages/ValidatePostalResponse'
  
  validateMunicipality:
    address: pricofy-geocode-es
    messages:
      ValidateMunicipalityRequest:
        $ref: '#/components/messages/ValidateMunicipalityRequest'
      ValidateMunicipalityResponse:
        $ref: '#/components/messages/ValidateMunicipalityResponse'
  
  autocompletePostal:
    address: pricofy-geocode-es
    messages:
      AutocompletePostalRequest:
        $ref: '#/components/messages/AutocompletePostalRequest'
      AutocompletePostalResponse:
        $ref: '#/components/messages/AutocompletePostalResponse'
  
  autocompleteMunicipality:
    address: pricofy-geocode-es
    messages:
      AutocompleteMunicipalityRequest:
        $ref: '#/components/messages/AutocompleteMunicipalityRequest'
      AutocompleteMunicipalityResponse:
        $ref: '#/components/messages/AutocompleteMunicipalityResponse'

components:
  messages:
    GeocodeByPostalRequest:
      name: GeocodeByPostalRequest
      title: Geocode By Postal Request
      summary: Request to geocode Spanish postal code or municipality to coordinates
      payload:
        type: object
        required: [operation]
        properties:
          operation:
            type: string
            const: geocode-by-postal
            description: Operation identifier
          postalCode:
            type: string
            description: Postal code (5 digits). Either postalCode or municipality is required.
            example: "28001"
          municipality:
            type: string
            description: Municipality name. Either postalCode or municipality is required.
            example: "Madrid"
        oneOf:
          - required: [postalCode]
          - required: [municipality]
    
    GeocodeByPostalResponse:
      name: GeocodeByPostalResponse
      title: Geocode By Postal Response
      summary: Response from geocode by postal operation
      payload:
        type: object
        required: [success]
        properties:
          success:
            type: boolean
            description: Whether the operation succeeded
          coords:
            type: object
            properties:
              lat:
                type: number
                description: Latitude
              lon:
                type: number
                description: Longitude
          municipality:
            type: string
            description: Municipality name
          province:
            type: string
            description: Province name
          postalCode:
            type: string
            description: Postal code
          source:
            type: string
            enum: [postal_code, municipality, reverse_geocode]
            description: Source of the result
    
    ReverseGeocodeRequest:
      name: ReverseGeocodeRequest
      title: Reverse Geocode Request
      summary: Request to reverse geocode coordinates to postal code
      payload:
        type: object
        required: [operation, lat, lon]
        properties:
          operation:
            type: string
            const: reverse-geocode
            description: Operation identifier
          lat:
            type: number
            minimum: -90
            maximum: 90
            description: Latitude
            example: 40.4168
          lon:
            type: number
            minimum: -180
            maximum: 180
            description: Longitude
            example: -3.7038
    
    ReverseGeocodeResponse:
      name: ReverseGeocodeResponse
      title: Reverse Geocode Response
      summary: Response from reverse geocode operation
      payload:
        type: object
        required: [success]
        properties:
          success:
            type: boolean
            description: Whether the operation succeeded
          city:
            type: string
            description: City/municipality name
          postalCode:
            type: string
            description: Postal code
          province:
            type: string
            description: Province name
          country:
            type: string
            description: Country name (always "España" for this service)
          coords:
            type: object
            properties:
              lat:
                type: number
                description: Latitude
              lon:
                type: number
                description: Longitude
          distance:
            type: number
            description: Distance to nearest postal code in kilometers
    
    ValidatePostalRequest:
      name: ValidatePostalRequest
      title: Validate Postal Request
      summary: Request to validate Spanish postal code
      payload:
        type: object
        required: [operation, postalCode]
        properties:
          operation:
            type: string
            const: validate-postal
            description: Operation identifier
          postalCode:
            type: string
            description: Postal code to validate (5 digits)
            example: "28001"
    
    ValidatePostalResponse:
      name: ValidatePostalResponse
      title: Validate Postal Response
      summary: Response from validate postal operation
      payload:
        type: object
        required: [valid]
        properties:
          valid:
            type: boolean
            description: Whether the postal code is valid
          value:
            type: string
            description: Input value that was validated
    
    ValidateMunicipalityRequest:
      name: ValidateMunicipalityRequest
      title: Validate Municipality Request
      summary: Request to validate Spanish municipality
      payload:
        type: object
        required: [operation, municipality]
        properties:
          operation:
            type: string
            const: validate-municipality
            description: Operation identifier
          municipality:
            type: string
            description: Municipality name to validate
            example: "Madrid"
    
    ValidateMunicipalityResponse:
      name: ValidateMunicipalityResponse
      title: Validate Municipality Response
      summary: Response from validate municipality operation
      payload:
        type: object
        required: [valid]
        properties:
          valid:
            type: boolean
            description: Whether the municipality is valid
          value:
            type: string
            description: Input value that was validated
    
    AutocompletePostalRequest:
      name: AutocompletePostalRequest
      title: Autocomplete Postal Request
      summary: Request to autocomplete Spanish postal code
      payload:
        type: object
        required: [operation, prefix]
        properties:
          operation:
            type: string
            const: autocomplete-postal
            description: Operation identifier
          prefix:
            type: string
            description: Postal code prefix to autocomplete
            example: "280"
          limit:
            type: integer
            default: 10
            description: Maximum number of results
            example: 5
    
    AutocompletePostalResponse:
      name: AutocompletePostalResponse
      title: Autocomplete Postal Response
      summary: Response from autocomplete postal operation
      payload:
        type: object
        required: [success]
        properties:
          success:
            type: boolean
            description: Whether the operation succeeded
          results:
            type: array
            items:
              type: object
              properties:
                postalCode:
                  type: string
                  description: Postal code (5 digits)
                municipality:
                  type: string
                  description: Municipality name
                province:
                  type: string
                  description: Province name
          count:
            type: integer
            description: Number of results returned
    
    AutocompleteMunicipalityRequest:
      name: AutocompleteMunicipalityRequest
      title: Autocomplete Municipality Request
      summary: Request to autocomplete Spanish municipality
      payload:
        type: object
        required: [operation, query]
        properties:
          operation:
            type: string
            const: autocomplete-municipality
            description: Operation identifier
          query:
            type: string
            description: Municipality name query (fuzzy search)
            example: "mad"
          limit:
            type: integer
            default: 10
            description: Maximum number of results
            example: 5
    
    AutocompleteMunicipalityResponse:
      name: AutocompleteMunicipalityResponse
      title: Autocomplete Municipality Response
      summary: Response from autocomplete municipality operation
      payload:
        type: object
        required: [success]
        properties:
          success:
            type: boolean
            description: Whether the operation succeeded
          results:
            type: array
            items:
              type: object
              properties:
                postalCode:
                  type: string
                  description: Postal code (5 digits)
                municipality:
                  type: string
                  description: Municipality name
                province:
                  type: string
                  description: Province name
          count:
            type: integer
            description: Number of results returned


  warmup:
    action: receive
    channel:
      $ref: '#/channels/warmup'
    summary: Lambda warmup (cold start prevention)
    description: |
      CloudWatch Events trigger this operation every 5 minutes to keep Lambda instances warm.
      Self-invokes with concurrency=2 to maintain 3 warm instances.
      Event: {"source": "warmup", "concurrency": 2}

    WarmupRequest:
      name: WarmupRequest
      title: Warmup Request
      summary: Lambda warmup request (cold start prevention)
      payload:
        type: object
        required: [source]
        properties:
          source:
            type: string
            const: warmup
            description: Warmup source identifier
          concurrency:
            type: integer
            default: 0
            description: Number of additional instances to spawn
            example: 2

    WarmupResponse:
      name: WarmupResponse
      title: Warmup Response
      summary: Response from warmup operation
      payload:
        type: object
        required: [statusCode]
        properties:
          statusCode:
            type: integer
            description: HTTP status code
            example: 200
          body:
            type: object
            properties:
              status:
                type: string
                description: Warmup status
                example: warm
              instancesWarmed:
                type: integer
                description: Number of instances warmed
                example: 3
